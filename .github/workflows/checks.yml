name: CPU scoring checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_publication.py
      - run: python -m pytest harness/test_scoring.py tests/ -q
      - run: python scripts/t12/verify_numbers.py
